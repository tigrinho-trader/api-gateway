# Sobe a aplicacao inteira localmente. Espera os repos lado a lado:
#   tigrinho-trader/
#     api-gateway/  (este)   trading-service/   wallet-service/   market-data-service/   user-service/   frontend/
#
# Login: OpenID Connect com um Keycloak local (servico keycloak, reino tigrinho), sem conta externa.
# Usuario de desenvolvimento: admin / admin123 (e-mail admin@tigrinho.local, vira ADMIN no primeiro login).
# Console do Keycloak: http://localhost:8180 (admin/admin). Tudo isso so vale para ambiente local.
# Para usar o Auth0 (ou outro provedor), defina AUTH_ISSUER, AUTH_JWKS_URI, AUTH_AUDIENCE e as VITE_OIDC_*
# no shell ou num arquivo .env ao lado deste (ver README). ADMIN_EMAILS=email1,email2 vira ADMIN no primeiro login.
#
#   docker compose up --build
#   http://localhost:3000             # o jogo
#   http://localhost:8180             # console do Keycloak
#   curl http://localhost:8080/api/cotacoes
#   ./scripts/teste-integracao.sh     # teste ponta a ponta com o ambiente no ar
#
# Sem acesso a Binance? SIMULADOR=true BINANCE=false docker compose up --build
name: tigrinho-trader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tigrinho
      POSTGRES_PASSWORD: tigrinho
      POSTGRES_DB: tigrinho
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigrinho"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" # painel: guest/guest
    healthcheck:
      # So libera os servicos quando a porta AMQP (5672) esta aberta. Nao usa rabbitmq-diagnostics:
      # ele roda como root e pode criar o .erlang.cookie antes do servidor, que entao cai com eacces.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 10s
      retries: 20

  # Provedor OpenID Connect local. KC_HOSTNAME fixa o emissor em http://localhost:8180/realms/tigrinho
  # (o que o navegador ve), mesmo quando o gateway busca as chaves por http://keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # admin do console: so para desenvolvimento local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/tigrinho-realm.json:/opt/keycloak/data/import/tigrinho-realm.json:ro
      # tema de login com a cara do jogo (start-dev nao faz cache: editar o CSS vale na hora)
      - ./infra/keycloak/themes/flecha-certeira:/opt/keycloak/themes/flecha-certeira:ro
    healthcheck:
      # a imagem nao tem curl: usa o /dev/tcp do bash no /health/ready da porta de gerenciamento (9000)
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200"'
      interval: 10s
      start_period: 30s
      retries: 30

  market-data-service:
    build: ../market-data-service
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      BINANCE_ENABLED: ${BINANCE:-true}
      SIMULADOR_ENABLED: ${SIMULADOR:-false}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  wallet-service:
    build: ../wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      RABBITMQ_HOST: rabbitmq
      # Pix (AbacatePay): defina no .env ao lado deste arquivo (ignorado pelo git). Vazio = Pix desligado.
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      WALLET_SANDBOX_HABILITADO: ${WALLET_SANDBOX_HABILITADO:-true}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  user-service:
    build: ../user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usuarios
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@tigrinho.local}
    depends_on:
      postgres: { condition: service_healthy }

  trading-service:
    build: ../trading-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading
      RABBITMQ_HOST: rabbitmq
      MARKET_DATA_URL: http://market-data-service:8083
      WALLET_URL: http://wallet-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    build: .
    ports:
      - "${GATEWAY_PORT:-8080}:8080" # GATEWAY_PORT=8090 se a 8080 estiver ocupada
    environment:
      TRADING_URL: http://trading-service:8081
      WALLET_URL: http://wallet-service:8082
      MARKET_DATA_URL: http://market-data-service:8083
      NOTIFICATION_URL: http://notification-service:8084
      USER_URL: http://user-service:8085
      # emissor = o que o navegador ve; chaves buscadas pela rede interna do compose
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8180/realms/tigrinho}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://keycloak:8080/realms/tigrinho/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-tigrinho-api}
      # primeira chamada ao user-service recem-ligado pode passar de 2s numa maquina carregada
      AUTH_STATUS_TIMEOUT: ${AUTH_STATUS_TIMEOUT:-5s}
      AUTH_CLAIMS_NAMESPACE: ${AUTH_CLAIMS_NAMESPACE:-https://tigrinho-trader/}
    depends_on:
      # o JWKS so e buscado no primeiro token: o gateway nao precisa esperar o Keycloak ficar pronto
      keycloak: { condition: service_started }
      user-service: { condition: service_started }
      trading-service: { condition: service_started }
      wallet-service: { condition: service_started }
      market-data-service: { condition: service_started }

  frontend:
    build:
      context: ../frontend
      # o Vite embute essas variaveis no build (o Dockerfile do frontend declara os ARGs).
      # Os padroes apontam para o Keycloak local. Atencao: um build arg vazio SOBRESCREVE o padrao do
      # Dockerfile, por isso authority e client id tem padrao aqui tambem. Para o Auth0 veja o README.
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8180/realms/tigrinho}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-flecha-certeira}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
        VITE_OIDC_PROVEDOR: ${VITE_OIDC_PROVEDOR:-keycloak}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      - api-gateway

volumes:
  pgdata:
