# Sobe a aplicacao inteira localmente. Espera os repos lado a lado:
#   tigrinho-trader/
#     api-gateway/  (este)   trading-service/   wallet-service/   market-data-service/   user-service/   frontend/
#
# Login pelo Auth0: exporte AUTH0_DOMAIN, AUTH0_AUDIENCE e AUTH0_CLIENT_ID (SPA) antes de subir
# (ou ponha num arquivo .env ao lado deste). ADMIN_EMAILS=email1,email2 vira ADMIN no primeiro login.
#
#   docker compose up --build
#   http://localhost:3000             # o jogo
#   curl http://localhost:8080/api/cotacoes
#   ./scripts/teste-integracao.sh     # teste ponta a ponta com o ambiente no ar
#
# Sem acesso a Binance? SIMULADOR=true BINANCE=false docker compose up --build
name: tigrinho-trader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tigrinho
      POSTGRES_PASSWORD: tigrinho
      POSTGRES_DB: tigrinho
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigrinho"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" # painel: guest/guest
    healthcheck:
      # So libera os servicos quando a porta AMQP (5672) esta aberta. Nao usa rabbitmq-diagnostics:
      # ele roda como root e pode criar o .erlang.cookie antes do servidor, que entao cai com eacces.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 10s
      retries: 20

  market-data-service:
    build: ../market-data-service
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      BINANCE_ENABLED: ${BINANCE:-true}
      SIMULADOR_ENABLED: ${SIMULADOR:-false}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  wallet-service:
    build: ../wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  user-service:
    build: ../user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usuarios
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres: { condition: service_healthy }

  trading-service:
    build: ../trading-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trading
      RABBITMQ_HOST: rabbitmq
      MARKET_DATA_URL: http://market-data-service:8083
      WALLET_URL: http://wallet-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    build: .
    ports:
      - "${GATEWAY_PORT:-8080}:8080" # GATEWAY_PORT=8090 se a 8080 estiver ocupada
    environment:
      TRADING_URL: http://trading-service:8081
      WALLET_URL: http://wallet-service:8082
      MARKET_DATA_URL: http://market-data-service:8083
      NOTIFICATION_URL: http://notification-service:8084
      USER_URL: http://user-service:8085
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-tigrinho-trader.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.tigrinho-trader}
      AUTH0_CLAIMS_NAMESPACE: ${AUTH0_CLAIMS_NAMESPACE:-https://tigrinho-trader/}
    depends_on:
      - user-service
      - trading-service
      - wallet-service
      - market-data-service

  frontend:
    build:
      context: ../frontend
      # o Vite embute essas variaveis no build (o Dockerfile do frontend declara os ARGs)
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:-tigrinho-trader.us.auth0.com}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.tigrinho-trader}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      - api-gateway

volumes:
  pgdata:
