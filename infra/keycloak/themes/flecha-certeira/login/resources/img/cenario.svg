<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Cenario do Campo do Vilarejo (mesmas cores do jogo) -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9fe0"/>
      <stop offset="0.45" stop-color="#73c6ef"/>
      <stop offset="0.8" stop-color="#bfe8f6"/>
      <stop offset="1" stop-color="#f2fbe9"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffad7" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#fff0aa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff0aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nevoa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1f3f6" stop-opacity="0"/>
      <stop offset="1" stop-color="#e1f3f6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="colinaLonge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d58a"/>
      <stop offset="1" stop-color="#7fb862"/>
    </linearGradient>
    <linearGradient id="colinaPerto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd16b"/>
      <stop offset="1" stop-color="#6ea843"/>
    </linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ccc65"/>
      <stop offset="0.6" stop-color="#7cb342"/>
      <stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6248"/>
      <stop offset="1" stop-color="#4a2f22"/>
    </linearGradient>
    <radialGradient id="copa" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#9ad85a"/>
      <stop offset="1" stop-color="#3f8f32"/>
    </radialGradient>
    <g id="nuvem">
      <ellipse cx="0" cy="12" rx="120" ry="34" fill="#cfe0ef" opacity="0.6"/>
      <circle cx="-70" cy="0" r="34" fill="#fff"/>
      <circle cx="-25" cy="-24" r="46" fill="#fff"/>
      <circle cx="30" cy="-18" r="40" fill="#fff"/>
      <circle cx="75" cy="2" r="30" fill="#fff"/>
      <rect x="-100" y="0" width="200" height="30" rx="15" fill="#fff"/>
    </g>
    <g id="arvore">
      <rect x="-6" y="-38" width="12" height="40" fill="#5d4037"/>
      <circle cx="3" cy="-56" r="30" fill="#2b6a25"/>
      <circle cx="0" cy="-60" r="30" fill="url(#copa)"/>
      <circle cx="-22" cy="-46" r="20" fill="url(#copa)"/>
      <circle cx="22" cy="-47" r="20" fill="url(#copa)"/>
      <circle cx="-8" cy="-80" r="18" fill="url(#copa)"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#ceu)"/>
  <circle cx="1340" cy="150" r="330" fill="url(#brilho)"/>
  <circle cx="1340" cy="150" r="60" fill="#fff6c2"/>

  <use href="#nuvem" transform="translate(260 170) scale(1.1)"/>
  <use href="#nuvem" transform="translate(760 110) scale(0.8)" opacity="0.9"/>
  <use href="#nuvem" transform="translate(1120 260) scale(0.7)" opacity="0.85"/>
  <use href="#nuvem" transform="translate(1500 420) scale(0.9)"/>

  <!-- montanhas nevadas -->
  <g>
    <polygon points="-80,740 180,420 440,740" fill="#a3b9d4"/>
    <polygon points="180,420 440,740 200,740" fill="#8aa1c0"/>
    <polygon points="180,420 232,484 210,478 196,492 170,476 128,484" fill="#f5f9fd"/>
    <polygon points="300,740 600,380 900,740" fill="#a3b9d4"/>
    <polygon points="600,380 900,740 630,740" fill="#8aa1c0"/>
    <polygon points="600,380 660,452 636,446 618,462 590,444 540,452" fill="#f5f9fd"/>
    <polygon points="760,740 1060,450 1360,740" fill="#a3b9d4"/>
    <polygon points="1060,450 1360,740 1090,740" fill="#8aa1c0"/>
    <polygon points="1060,450 1118,506 1096,500 1080,514 1052,498 1004,506" fill="#f5f9fd"/>
    <polygon points="1200,740 1480,400 1760,740" fill="#a3b9d4"/>
    <polygon points="1480,400 1760,740 1510,740" fill="#8aa1c0"/>
    <polygon points="1480,400 1536,468 1514,462 1498,476 1470,460 1424,468" fill="#f5f9fd"/>
  </g>
  <rect y="430" width="1600" height="320" fill="url(#nevoa)"/>

  <!-- colinas -->
  <path d="M0 700 C 200 640, 380 660, 560 690 S 940 640, 1120 680 S 1440 650, 1600 690 L1600 820 L0 820 Z" fill="url(#colinaLonge)"/>
  <path d="M0 760 C 180 720, 420 740, 640 760 S 1040 720, 1260 750 S 1500 740, 1600 750 L1600 830 L0 830 Z" fill="url(#colinaPerto)"/>

  <use href="#arvore" transform="translate(150 768) scale(1.1)"/>
  <use href="#arvore" transform="translate(215 772) scale(0.8)"/>
  <use href="#arvore" transform="translate(1290 760) scale(1.2)"/>
  <use href="#arvore" transform="translate(1370 768) scale(0.85)"/>
  <use href="#arvore" transform="translate(1500 764) scale(1)"/>

  <!-- grama e terra -->
  <rect y="812" width="1600" height="88" fill="url(#terra)"/>
  <path d="M0 790 Q 40 784 80 790 T 160 790 T 240 790 T 320 790 T 400 790 T 480 790 T 560 790 T 640 790 T 720 790 T 800 790 T 880 790 T 960 790 T 1040 790 T 1120 790 T 1200 790 T 1280 790 T 1360 790 T 1440 790 T 1520 790 T 1600 790 L1600 822 L0 822 Z" fill="url(#grama)"/>
  <g fill="#b6a59a" opacity="0.8">
    <ellipse cx="120" cy="850" rx="12" ry="7"/>
    <ellipse cx="420" cy="868" rx="9" ry="5"/>
    <ellipse cx="760" cy="852" rx="14" ry="8"/>
    <ellipse cx="1080" cy="872" rx="10" ry="6"/>
    <ellipse cx="1420" cy="856" rx="13" ry="7"/>
  </g>
  <g fill="#fff">
    <circle cx="300" cy="800" r="4"/>
    <circle cx="560" cy="804" r="4"/>
    <circle cx="940" cy="801" r="4"/>
    <circle cx="1180" cy="805" r="4"/>
  </g>
  <g fill="#fff176">
    <circle cx="380" cy="806" r="4"/>
    <circle cx="700" cy="800" r="4"/>
    <circle cx="1020" cy="806" r="4"/>
    <circle cx="1460" cy="802" r="4"/>
  </g>
</svg>
