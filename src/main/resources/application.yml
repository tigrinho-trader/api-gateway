server:
  port: 8080
  # cookies de outros sites em localhost + token passam facil de 8 KB (o padrao); acima disso: 431
  max-http-request-header-size: 32KB

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # a API e autenticada por token Bearer: cookies nao vao para os servicos
      default-filters:
        - RemoveRequestHeader=Cookie
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: '*' # inclui Authorization
      # /api/<recurso>/** -> servico dono do recurso, sem o prefixo /api.
      # Quem e publico e quem exige JWT fica em SegurancaConfig.
      routes:
        - id: usuarios
          uri: ${USER_URL:http://localhost:8085}
          predicates:
            - Path=/api/usuarios,/api/usuarios/**
          filters:
            - StripPrefix=1
        - id: jogos
          uri: ${TRADING_URL:http://localhost:8081}
          predicates:
            - Path=/api/jogos/**
          filters:
            - StripPrefix=1
        - id: trading
          uri: ${TRADING_URL:http://localhost:8081}
          predicates:
            - Path=/api/ordens,/api/ordens/**
          filters:
            - StripPrefix=1
        - id: wallet
          uri: ${WALLET_URL:http://localhost:8082}
          predicates:
            - Path=/api/carteira,/api/carteira/**
          filters:
            - StripPrefix=1
        - id: market-data
          uri: ${MARKET_DATA_URL:http://localhost:8083}
          predicates:
            - Path=/api/cotacoes,/api/cotacoes/**
          filters:
            - StripPrefix=1
        - id: notification
          uri: ${NOTIFICATION_URL:http://localhost:8084}
          predicates:
            - Path=/api/notificacoes,/api/notificacoes/**
          filters:
            - StripPrefix=1
        # Painel do super-admin (token do login do painel, conferido no FiltroPainel): /api/painel/<servico>/x ->
        # /painel/x no servico. O login (POST /api/painel/login) e do proprio gateway.
        - id: painel-jogo
          uri: ${TRADING_URL:http://localhost:8081}
          predicates:
            - Path=/api/painel/jogo/**
          filters:
            - RewritePath=/api/painel/jogo/(?<resto>.*), /painel/$\{resto}
        - id: painel-carteira
          uri: ${WALLET_URL:http://localhost:8082}
          predicates:
            - Path=/api/painel/carteira/**
          filters:
            - RewritePath=/api/painel/carteira/(?<resto>.*), /painel/$\{resto}
        - id: painel-usuarios
          uri: ${USER_URL:http://localhost:8085}
          predicates:
            - Path=/api/painel/usuarios
          filters:
            - SetPath=/painel/usuarios

# Login OpenID Connect + checagem de conta (ver AuthPropriedades).
# Padrao: Keycloak local (docker-compose, porta 8180). Para o Auth0, defina AUTH_ISSUER, AUTH_JWKS_URI e
# AUTH_AUDIENCE (ver README).
tigrinho:
  auth:
    emissor: ${AUTH_ISSUER:http://localhost:8180/realms/tigrinho}
    jwks-uri: ${AUTH_JWKS_URI:${tigrinho.auth.emissor}/protocol/openid-connect/certs}
    audiencia: ${AUTH_AUDIENCE:tigrinho-api}
    namespace-claims: ${AUTH_CLAIMS_NAMESPACE:https://tigrinho-trader/}
    usuarios-url: ${USER_URL:http://localhost:8085}
    cache-status: ${AUTH_STATUS_CACHE:30s}
    timeout-status: ${AUTH_STATUS_TIMEOUT:2s}
  # Login do painel do super-admin. A senha nao fica aqui: so o hash (gere com scripts/senha_painel.py).
  # Sem PAINEL_SENHA_HASH ou PAINEL_SEGREDO o painel fica desligado.
  painel:
    usuario: ${PAINEL_USUARIO:super-admin-oscar}
    senha-hash: ${PAINEL_SENHA_HASH:}
    segredo: ${PAINEL_SEGREDO:}
    validade: ${PAINEL_VALIDADE:8h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
